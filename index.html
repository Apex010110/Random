<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattleZone Royale</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- ══ MAIN MENU ══ -->
<div id="menu" class="overlay">
    <div class="menu-box">
        <h1>BATTLEZONE<br>ROYALE</h1>
        <div class="badge-row">
            <span class="badge">20 PLAYERS</span>
            <span class="badge">19 BOTS</span>
            <span class="badge">SHRINKING STORM</span>
            <span class="badge">4 WEAPONS</span>
        </div>
        <button class="btn-play" id="playBtn">PLAY NOW</button>
        <div class="controls">
            <h3>Controls</h3>
            <div class="ctrl-grid">
                <span class="ctrl-key">WASD</span>      <span class="ctrl-desc">Move</span>
                <span class="ctrl-key">Mouse</span>     <span class="ctrl-desc">Aim</span>
                <span class="ctrl-key">LMB</span>       <span class="ctrl-desc">Shoot</span>
                <span class="ctrl-key">E</span>         <span class="ctrl-desc">Open chest / Pick up loot</span>
                <span class="ctrl-key">R</span>         <span class="ctrl-desc">Reload</span>
                <span class="ctrl-key">1 / 2 / 3</span><span class="ctrl-desc">Switch weapon slot</span>
                <span class="ctrl-key">Scroll</span>    <span class="ctrl-desc">Cycle weapons</span>
            </div>
        </div>
    </div>
</div>

<!-- ══ DEATH SCREEN ══ -->
<div id="deathScreen" class="overlay hidden">
    <div class="menu-box">
        <h1>ELIMINATED</h1>
        <p class="subtitle" id="deathStats"></p>
        <button class="btn-play" id="respawnBtn">PLAY AGAIN</button>
    </div>
</div>

<!-- ══ WIN SCREEN ══ -->
<div id="winScreen" class="overlay hidden">
    <div class="menu-box">
        <h1 class="win-title">#1 VICTORY<br>ROYALE!</h1>
        <p class="subtitle" id="winStats"></p>
        <button class="btn-play" id="winPlayBtn">PLAY AGAIN</button>
    </div>
</div>

<!-- Scripts (load order matters) -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/world.js"></script>
<script src="js/weapon.js"></script>
<script src="js/loot.js"></script>
<script src="js/storm.js"></script>
<script src="js/player.js"></script>
<script src="js/bot.js"></script>
<script src="js/hud.js"></script>
<script src="js/game.js"></script>

</body>
</html>
